name: CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package and any testing tools (e.g., pytest)
          pip install . pytest

      - name: Run tests
        run: |
          # Replace 'pytest src/' with your actual test command if you use something else.
          # E.g., python -m unittest discover src/
          pytest src/
