[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnnlib-satisfactory"
version = "0.0.1"
authors = [
  { name="Lukas Rohwer", email="24215157@student.uwa.edu.au" },
  { name="Bella Lu", email="24491136@student.uwa.edu.au" },
  { name="Kylie Verzosa", email="24268374@student.uwa.edu.au" },
  { name="Rundong Wu", email="24441894@student.uwa.edu.au" },
  { name="Randall Heng", email="24271194@student.uwa.edu.au" },
  { name="Danny Nguyen", email="24256619@student.uwa.edu.au" },
]
description = "VNN-LIB SATisfactory -- an automated, mathematically grounded testing suite for VNN-LIB 2.0 neural network solvers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0,<1.0",
    "onnx>=1.15,<2.0",
    "onnxruntime>=1.17,<2.0",
    "onnxscript>=0.1.0,<1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/randollz/CITS3200---Team-28"
Issues = "https://github.com/randollz/CITS3200---Team-28/issues"

[project.scripts]
vnnlib-satisfactory = "vnntest.cli.main:app"
vnntest = "vnntest.cli.main:app"
[tool.hatch.build.targets.wheel]
packages = ["src/vnntest"]
